<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moja lokalizacja i orientacja</title>

    <meta name="theme-color" content="#2196f3">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/ikona.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <p id="latitude">Szerokość: oczekiwanie...</p>
        <p id="longitude">Długość: oczekiwanie...</p>

        <h3>Orientacja urządzenia</h3>

        <p id="alpha">Alpha: oczekiwanie...</p>
        <p id="beta">Beta: oczekiwanie...</p>
        <p id="gamma">Gamma: oczekiwanie...</p>

        <button id="orientationButton">Włącz orientację</button>

        <h3>Ruch urządzenia</h3>

        <p id="accelerationX">X: oczekiwanie...</p>
        <p id="accelerationY">Y: oczekiwanie...</p>
        <p id="accelerationZ">Z: oczekiwanie...</p>

        <button id="motionButton">Włącz wykrywanie ruchu</button>

        <h3>Wibracje urządzenia</h3>

        <button id="vibrationButton">Włącz wibracje</button>    
    </div>

    <script>
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    document.getElementById("latitude").textContent =
                        "Szerokość: " + position.coords.latitude;

                    document.getElementById("longitude").textContent =
                        "Długość: " + position.coords.longitude;
                },
                (error) => {
                    document.getElementById("latitude").textContent =
                        "Nie udało się pobrać lokalizacji.";

                    document.getElementById("longitude").textContent =
                        error.message;
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );
        }

        function startOrientation() {
            if (!("DeviceOrientationEvent" in window)) {
                alert("Orientacja urządzenia nie jest obsługiwana.");
                return;
            }

            window.addEventListener("deviceorientation", (event) => {
                document.getElementById("alpha").textContent =
                    "Alpha: " + (event.alpha?.toFixed(2) ?? "brak danych");

                document.getElementById("beta").textContent =
                    "Beta: " + (event.beta?.toFixed(2) ?? "brak danych");

                document.getElementById("gamma").textContent =
                    "Gamma: " + (event.gamma?.toFixed(2) ?? "brak danych");
            });
        }

        document.getElementById("orientationButton")
            .addEventListener("click", async () => {

                if (
                    typeof DeviceOrientationEvent.requestPermission === "function"
                ) {
                    try {
                        const permission =
                            await DeviceOrientationEvent.requestPermission();

                        if (permission === "granted") {
                            startOrientation();
                        } else {
                            alert("Brak zgody na dostęp do orientacji.");
                        }
                    } catch (error) {
                        alert("Nie udało się uzyskać dostępu do orientacji.");
                    }
                } else {
                    startOrientation();
                }
            });
        
        function startMotion() {
            if (!("DeviceMotionEvent" in window)) {
                alert("Wykrywanie ruchu nie jest obsługiwane.");
                return;
            }

            window.addEventListener("devicemotion", (event) => {
                const acceleration = event.accelerationIncludingGravity;

                if (!acceleration) {
                    return;
                }

                document.getElementById("accelerationX").textContent =
                    "X: " + (acceleration.x?.toFixed(2) ?? "brak danych");

                document.getElementById("accelerationY").textContent =
                    "Y: " + (acceleration.y?.toFixed(2) ?? "brak danych");

                document.getElementById("accelerationZ").textContent =
                    "Z: " + (acceleration.z?.toFixed(2) ?? "brak danych");
            });
        }

        document.getElementById("motionButton")
            .addEventListener("click", async () => {

                if (
                    typeof DeviceMotionEvent.requestPermission === "function"
                ) {
                    try {
                        const permission =
                            await DeviceMotionEvent.requestPermission();

                        if (permission === "granted") {
                            startMotion();
                        } else {
                            alert("Brak zgody na dostęp do czujników ruchu.");
                        }
                    } catch (error) {
                        alert("Nie udało się uzyskać dostępu do czujników ruchu.");
                    }
                } else {
                    startMotion();
                }
            });
        
        document.getElementById("vibrationButton")
            .addEventListener("click", () => {

                if ("vibrate" in navigator) {
                    navigator.vibrate(1000);
                } else {
                    alert("Wibracje nie są obsługiwane przez to urządzenie.");
                }
            });
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .catch(error => console.error(
                        "Błąd rejestracji Service Workera:", error
                    ));
            });
        }
    </script>

</body>
</html>
